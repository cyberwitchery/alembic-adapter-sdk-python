name: ci

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: install package with dev dependencies
        run: pip install -e ".[dev]"
      - name: run tests with coverage gate
        run: |
          coverage run -m unittest discover -s tests -v
          coverage report

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/ruff-action@v3
      - run: ruff check
      - run: ruff format --check

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build
      - run: python -m build

  # protocol conformance: the runner that ships alongside alembic drives the
  # example adapter through the external-adapter contract.
  conformance:
    name: conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: install package
        run: pip install -e .
      - uses: dtolnay/rust-toolchain@stable
      - name: cache the conformance runner
        id: cache
        uses: actions/cache@v6
        with:
          path: bin/alembic-adapter-test
          key: alembic-adapter-test-${{ runner.os }}-0.8.0
      - name: build alembic-adapter-test
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          cargo install alembic-adapter-test --version "=0.8.0" --debug --locked \
            --root "${RUNNER_TEMP}/cargo"
          mkdir -p bin
          cp "${RUNNER_TEMP}/cargo/bin/alembic-adapter-test" bin/alembic-adapter-test
          strip bin/alembic-adapter-test
      - name: run conformance
        run: ./bin/alembic-adapter-test -- python examples/example_adapter.py

  success:
    name: success
    needs: [test, lint, build, conformance]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: check results
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            exit 1
          fi
