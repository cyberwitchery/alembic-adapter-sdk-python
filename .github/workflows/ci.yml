name: ci

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # the alembic release the sdk is checked against. every release attaches static
  # binaries, so the host checks below need no rust toolchain. bump this
  # deliberately: a red run then means a real protocol break, not upstream noise.
  ALEMBIC_VERSION: v0.10.0
  # ubuntu-latest runners are x86_64.
  ALEMBIC_TARGET: x86_64-unknown-linux-gnu

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: install package with dev dependencies
        run: pip install -e ".[dev]"
      - name: run tests with coverage gate
        run: |
          coverage run -m unittest discover -s tests -v
          coverage report

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - uses: astral-sh/ruff-action@4919ec5cf1f49eff0871dbcea0da843445b837e6 # v3.6.1
      - run: ruff check
      - run: ruff format --check

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build
      - run: python -m build

  # protocol conformance: the runner that ships alongside alembic drives the
  # example adapter through the external-adapter contract.
  conformance:
    name: conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: install package
        run: pip install -e .
      - name: fetch alembic-adapter-test
        run: |
          name="alembic-adapter-test-${ALEMBIC_VERSION}-${ALEMBIC_TARGET}"
          curl -sSfL -o runner.tar.gz \
            "https://github.com/cyberwitchery/alembic/releases/download/${ALEMBIC_VERSION}/${name}.tar.gz"
          tar xzf runner.tar.gz
          mkdir -p bin
          mv "${name}/alembic-adapter-test" bin/
      - name: run conformance
        run: ./bin/alembic-adapter-test -- python examples/example_adapter.py

  # the real host against this sdk: the alembic cli spawns an adapter written
  # with the sdk and converges an inventory through plan/apply. every request the
  # sdk parses here is one the host really produced, so a host-side shape change
  # fails ci instead of waiting for a user to hit it.
  e2e:
    name: e2e (alembic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: install package
        run: pip install -e .
      - name: fetch the alembic cli
        run: |
          name="alembic-${ALEMBIC_VERSION}-${ALEMBIC_TARGET}"
          curl -sSfL -o alembic.tar.gz \
            "https://github.com/cyberwitchery/alembic/releases/download/${ALEMBIC_VERSION}/${name}.tar.gz"
          tar xzf alembic.tar.gz
          mkdir -p "$HOME/.local/bin"
          mv "${name}/alembic" "$HOME/.local/bin/alembic"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: run the alembic-driven e2e
        run: bash tests/e2e-alembic.sh

  success:
    name: success
    needs: [test, lint, build, conformance, e2e]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: check results
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            exit 1
          fi
